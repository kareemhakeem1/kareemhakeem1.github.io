<style>
:root{--gold:#C9A961;--gold-soft:rgba(201,169,97,.12);--ink:#000;--card:#0d0d0d;--line:rgba(201,169,97,.35);--text:#f2f2f2;--muted:#a5a5a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{background:#1b1b1b;min-height:100%}
body{font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text);display:flex;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.logo{background:#000;padding:14px 32px 12px;text-align:center;border-bottom:1px solid var(--line)}
.logo img{width:100%;max-width:132px;height:auto;aspect-ratio:2.74/1;object-fit:contain;display:block;margin:0 auto}
.profile{text-align:center;padding:28px 24px 22px}
.photo{width:128px;height:128px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--gold);display:block;margin:0 auto 18px;background:#fff}
h1{font-size:23px;font-weight:600;letter-spacing:.3px;color:var(--gold)}
.role{font-size:13.5px;color:var(--text);margin-top:6px;font-weight:500}
.org{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
.list{padding:6px 16px 10px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;color:var(--text);text-decoration:none;font-size:13.5px;line-height:1.45}
.row:hover,.row:focus-visible{background:var(--gold-soft);outline:none}
.row + .row{border-top:1px solid rgba(255,255,255,.05)}
.ic{flex:0 0 38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ic svg{width:18px;height:18px}
.row span{word-break:break-word}
.social{display:flex;justify-content:center;gap:18px;padding:18px;border-top:1px solid var(--line)}
.sbtn,.abtn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:transparent;cursor:pointer;transition:background .2s}
.sbtn svg,.abtn svg{width:24px;height:24px}
.sbtn:hover,.abtn:hover,.sbtn:focus-visible,.abtn:focus-visible{background:var(--gold-soft);outline:none}
.qr{border-top:1px solid var(--line);padding:22px;text-align:center}
.qrbox{display:inline-block;background:#fff;padding:10px;border-radius:12px;line-height:0}
.qrbox canvas,.qrbox img{width:150px;height:150px}
.qr p{font-size:11.5px;color:var(--muted);margin-top:10px}
.actions{display:flex;justify-content:center;gap:28px;padding:16px 18px 22px;border-top:1px solid var(--line)}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--gold);letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#000;font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
svg .g{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:var(--gold)}

.panel{display:none;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 18px 20px}
.panel.open{display:flex}
.pbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);background:transparent;font:500 12.5px 'Montserrat',system-ui,sans-serif;text-decoration:none;cursor:pointer}
.pbtn svg{width:16px;height:16px}
.pbtn:hover,.pbtn:focus-visible{background:var(--gold-soft);outline:none}
.act[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function getDownloads(){try{return (window.claude&&window.claude.use)?await window.claude.use("downloads"):null}catch(e){return null}}

document.getElementById('dl').addEventListener('click',async()=>{
  const btn=document.getElementById('dl');
  btn.disabled=true;
  toast("Preparing image...");
  try{
    let blob=null, err=null;
    // Preferred path: html2canvas if it actually loaded from the CDN.
    if(typeof html2canvas==="function"){
      try{
        const canvas=await html2canvas(document.querySelector('.card'),{backgroundColor:"#0d0d0d",scale:3,useCORS:true,ignoreElements:el=>el.id==="actions"||el.id==="panel"});
        blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
      }catch(e){err=e}
    }
    // Fallback: draw the card ourselves. No CDN, no network, always works.
    if(!blob){ blob=await renderCardFallback(); }
    if(!blob){ toast(err?"Couldn't prepare the image":"Image rendering unavailable"); return; }

    const dl=await getDownloads();
    if(dl){
      try{
        await dl.save({filename:"Kareem_Hakeem_Card.png",data:blob});
        toast("Card saved");
      }catch(e){
        const code=e&&e.code;
        if(code==="declined") return;
        if(code==="rate_limited"){ toast("Please try again in a moment"); return; }
        blobDownload(blob,"Kareem_Hakeem_Card.png");
        toast("Card saved");
      }
    }else{
      blobDownload(blob,"Kareem_Hakeem_Card.png");
      toast("Card saved");
    }
  }catch(e){
    toast("Couldn't prepare the image");
  }finally{
    btn.disabled=false;
  }
});

// Self-contained card renderer: plain canvas, no external library.
async function renderCardFallback(){
  try{
    const S=3, W=380, H=620;
    const c=document.createElement('canvas');
    c.width=W*S; c.height=H*S;
    const x=c.getContext('2d');
    x.scale(S,S);
    const GOLD="#C9A961", TXT="#f2f2f2", MUT="#9a9a9a";

    x.fillStyle="#0d0d0d"; x.fillRect(0,0,W,H);
    x.fillStyle="#000"; x.fillRect(0,0,W,86);

    const load=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
    const [logo,photo]=await Promise.all([
      load(document.querySelector('.logo img').src),
      load(document.querySelector('.photo img, .avatar img, img.photo')?.src||"")
    ]);

    if(logo){
      const lw=132, lh=lw/(logo.width/logo.height);
      x.drawImage(logo,(W-lw)/2,(86-lh)/2,lw,lh);
    }
    x.strokeStyle="rgba(201,169,97,.25)"; x.lineWidth=1;
    x.beginPath(); x.moveTo(0,86.5); x.lineTo(W,86.5); x.stroke();

    let y=86+24;
    if(photo){
      const r=64, cx=W/2, cy=y+r;
      x.save(); x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.clip();
      const s=Math.max((r*2)/photo.width,(r*2)/photo.height);
      x.drawImage(photo,cx-photo.width*s/2,cy-r,photo.width*s,photo.height*s);
      x.restore();
      x.strokeStyle=GOLD; x.lineWidth=3;
      x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
      y=cy+r+30;
    }

    const line=(txt,size,weight,color,gap,spacing)=>{
      x.fillStyle=color;
      x.font=weight+" "+size+"px Montserrat, system-ui, sans-serif";
      x.textAlign="center";
      if(spacing&&x.letterSpacing!==undefined) x.letterSpacing=spacing;
      x.fillText(txt,W/2,y);
      if(x.letterSpacing!==undefined) x.letterSpacing="0px";
      y+=gap;
    };
    line("KAREEM HAKEEM",21,"700",TXT,24,"1px");
    line("Head of Procurement & Supply Chain",12.5,"500",GOLD,20);
    line("Premiere Cinemas",12,"400",MUT,30);

    const rows=[
      ["Phone","01121307000"],
      ["Email","Khakeem@premiere-cinemas.com"],
      ["Address","35 Champollion Rd, Cairo"]
    ];
    x.textAlign="left";
    for(const [k,v] of rows){
      x.fillStyle=GOLD; x.font="600 10px Montserrat, system-ui, sans-serif";
      x.fillText(k.toUpperCase(),32,y);
      x.fillStyle=TXT; x.font="400 12.5px Montserrat, system-ui, sans-serif";
      x.fillText(v,32,y+17);
      y+=42;
    }

    // Include the QR so the printed/shared image still saves the contact.
    const qrEl=document.querySelector('.qrbox canvas, .qrbox img');
    if(qrEl){
      const q=qrEl.tagName==="CANVAS"?qrEl:await load(qrEl.src);
      if(q){
        const size=118, qx=(W-size)/2, qy=H-size-34;
        x.fillStyle="#fff";
        x.fillRect(qx-9,qy-9,size+18,size+18);
        x.drawImage(q,qx,qy,size,size);
      }
    }
    return await new Promise(r=>c.toBlob(r,"image/png"));
  }catch(e){ return null }
}

    if(!framed){
      blobDownload(blob,"Kareem_Hakeem.vcf");
      toast("Opening contact...");
      return;
    }
    // Path B: framed -> ask the host to save it.
    const dl=await getDownloads();
    if(dl){
      try{
        await dl.save({filename:"Kareem_Hakeem.vcf",data:blob});
        toast("Contact saved");
        return;
      }catch(e){
        const code=e&&e.code;
        if(code==="declined") return;
        if(code==="rate_limited"){ toast("Please try again in a moment"); return; }
        // vcf may be outside the allowlist here -> fall through.
      }
    }
    // Path C: open the vCard in a new tab so the OS can import it.
    const url=URL.createObjectURL(blob);
    const w=window.open(url,"_blank");
    if(w){ toast("Opening contact..."); setTimeout(()=>URL.revokeObjectURL(url),8000); }
    else { URL.revokeObjectURL(url); toast("Scan the QR code to save the contact"); }
  }catch(e){
    toast("Scan the QR code to save the contact");
  }finally{ btn.disabled=false; }
});

// Deep link: opening the card with #save or ?save triggers the contact import.
(function(){
  const wants = location.hash.toLowerCase()==="#save" || /[?&]save\b/i.test(location.search);
  if(!wants || framed) return;
  window.addEventListener('load',()=>{
    setTimeout(()=>document.getElementById('vcf').click(),500);
  });
})();

const panel=document.getElementById('panel'),shBtn=document.getElementById('sh');
document.getElementById('shWa').href="https://wa.me/?text="+encodeURIComponent(shareText);
document.getElementById('shMail').href="mailto:?subject="+encodeURIComponent("Kareem Hakeem - Premiere Cinemas")+"&body="+encodeURIComponent(shareText);
shBtn.addEventListener('click',async()=>{
  if(!framed&&navigator.share){try{await navigator.share({title:"Kareem Hakeem | Premiere Cinemas",url:CARD_URL});return}catch(e){if(e.name==="AbortError")return}}
  const open=!panel.classList.contains('open');panel.classList.toggle('open',open);shBtn.setAttribute('aria-expanded',open);
});
document.getElementById('shCopy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(CARD_URL);toast("Link copied")}
  catch(e){const ta=document.createElement('textarea');ta.value=CARD_URL;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?"Link copied":CARD_URL)}
});
</script>
